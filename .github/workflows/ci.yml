name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-macos:
    name: Swift ${{ matrix.swift }} on macOS ${{ matrix.macos }} with Xcode ${{ matrix.xcode }}${{ matrix.variant == 'async_http_client' && ' (AsyncHTTPClient)' || '' }}
    runs-on: ${{ matrix.runner }}
    env:
      DEVELOPER_DIR: "/Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer"
    strategy:
      fail-fast: false
      matrix:
        include:
          - macos: "15"
            runner: macos-15
            swift: "6.0"
            xcode: "16.0"
            variant: default
          - macos: "15"
            runner: macos-15
            swift: "6.1"
            xcode: "16.4"
            variant: default
          - macos: "26"
            runner: macos-26
            swift: "6.2"
            xcode: "26.3"
            variant: default
          - macos: "26"
            runner: macos-26
            swift: "6.3"
            xcode: "26.6"
            variant: default
          - macos: "27"
            runner: xcode-27
            swift: "6.4"
            xcode: "27.0"
            variant: default
          - macos: "15"
            runner: macos-15
            swift: "6.1"
            xcode: "16.4"
            variant: async_http_client
          - macos: "26"
            runner: macos-26
            swift: "6.2"
            xcode: "26.3"
            variant: async_http_client
          - macos: "26"
            runner: macos-26
            swift: "6.3"
            xcode: "26.6"
            variant: async_http_client
          - macos: "27"
            runner: xcode-27
            swift: "6.4"
            xcode: "27.0"
            variant: async_http_client
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache Swift Package Manager dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/org.swift.swiftpm
            .build
          key: ${{ runner.os }}-swift-${{ matrix.swift }}-${{ matrix.variant }}-spm-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.swift }}-${{ matrix.variant }}-spm-

      - name: Configure variant
        run: |
          if [ "${{ matrix.variant }}" = "async_http_client" ]; then
            echo "SWIFT_VARIANT_ARGS=--traits AsyncHTTPClient --scratch-path .build/async-http-client" >> "$GITHUB_ENV"
          else
            echo "SWIFT_VARIANT_ARGS=--scratch-path .build/default" >> "$GITHUB_ENV"
          fi

      - name: Lint
        run: swift format lint --recursive . --strict

      - name: Build
        run: swift build $SWIFT_VARIANT_ARGS

      - name: Test
        run: swift test $SWIFT_VARIANT_ARGS

  test-linux:
    name: Swift ${{ matrix.swift-version }} on Linux${{ matrix.variant == 'async_http_client' && ' (AsyncHTTPClient)' || '' }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift-version: "6.0.3"
            variant: default
          - swift-version: "6.1.3"
            variant: default
          - swift-version: "6.2.4"
            variant: default
          - swift-version: "6.3.3"
            variant: default
          - swift-version: "6.4.0"
            variant: default
          - swift-version: "6.1.3"
            variant: async_http_client
          - swift-version: "6.2.4"
            variant: async_http_client
          - swift-version: "6.3.3"
            variant: async_http_client
          - swift-version: "6.4.0"
            variant: async_http_client
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: ${{ matrix.swift-version }}

      - name: Configure variant
        run: |
          if [ "${{ matrix.variant }}" = "async_http_client" ]; then
            echo "SWIFT_VARIANT_ARGS=--traits AsyncHTTPClient --scratch-path .build/async-http-client" >> "$GITHUB_ENV"
          else
            echo "SWIFT_VARIANT_ARGS=--scratch-path .build/default" >> "$GITHUB_ENV"
          fi

      - name: Build
        run: swift build $SWIFT_VARIANT_ARGS

      - name: Test
        run: swift test $SWIFT_VARIANT_ARGS

  build-wasi:
    name: Swift ${{ matrix.swift-version }} for WASI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - swift-version: "6.4.1"
            wasm-sdk-checksum: "783e6128d174d9f975b4eda68be02a5960681b723ef372e6876a7c2543a365d8"
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Swift
        uses: vapor/swiftly-action@v0.2
        with:
          toolchain: ${{ matrix.swift-version }}

      - name: Install Swift SDK for WASI
        run: |
          swift sdk install \
            "https://download.swift.org/swift-${{ matrix.swift-version }}-release/wasm-sdk/swift-${{ matrix.swift-version }}-RELEASE/swift-${{ matrix.swift-version }}-RELEASE_wasm.artifactbundle.tar.gz" \
            --checksum "${{ matrix.wasm-sdk-checksum }}"

      - name: Build
        run: swift build --swift-sdk "swift-${{ matrix.swift-version }}-RELEASE_wasm"
